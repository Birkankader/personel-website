[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # Astro 7.4 needs Node 22.22 or newer.
  NODE_VERSION = "24"

# Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# Directory addresses used in JetBrains repository settings also serve XML.
[[redirects]]
  from = "/plugins"
  to = "/plugins/updatePlugins.xml"
  status = 200
  force = true

[[redirects]]
  from = "/plugins/"
  to = "/plugins/updatePlugins.xml"
  status = 200
  force = true

# Hashed build assets (scripts, styles, images, fonts) never change.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
